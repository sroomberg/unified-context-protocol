[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "ucp"
version = "0.1.1"
description = "Optional Python bindings for Unified Context Protocol (Rust core is primary)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Unified Context Protocol" }]
keywords = [
    "llm",
    "context",
    "prompt-caching",
    "tokenizer",
    "protocol",
    "pyo3",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "typing-extensions>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "maturin>=1.7.0",
]

[project.urls]
Homepage = "https://github.com/sroomberg/unified-context-protocol"
Documentation = "https://github.com/sroomberg/unified-context-protocol#readme"

[tool.maturin]
features = ["python"]
module-name = "ucp._engine"
python-source = "python"
manifest-path = "Cargo.toml"
include = [
    "python/ucp/**/*.py",
    "tokenizers/.gitkeep",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ucp"]
mypy_path = "python"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
