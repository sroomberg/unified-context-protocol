name: Release Please

on:
  push:
    branches: [master, main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    name: Update changelog & GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # On ordinary pushes, release-please opens/updates a Release PR whose body
      # and CHANGELOG.md summarize commits since the last tag.
      # When that Release PR is merged, this workflow runs again and creates the
      # GitHub Release + git tag (releases_created=true).
      - name: Note release creation
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: echo "Published GitHub release ${{ steps.release.outputs.tag_name }}"
